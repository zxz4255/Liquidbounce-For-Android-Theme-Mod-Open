name: Release

on:
  push:
    branches: [ nextgen, main, master ]
    paths:
      - '.github/workflows/release.yml'
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon

      - name: 提取主 JAR（排除 sources）
        run: |
          JAR=$(ls build/libs/customtitle-*.jar | grep -v sources | head -n 1)
          if [ -z "$JAR" ]; then echo "❌ 未找到主 JAR"; exit 1; fi
          echo "✅ 使用 JAR: $JAR"
          cp "$JAR" ./customtitle.jar
      - name: 上传 JAR 作为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidbounce title mod
          path: liquidbounce title mod .jar
          retention-days: 90

      - name: 创建 Release 并上传 JAR
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: liquidbounce title mod.jar
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

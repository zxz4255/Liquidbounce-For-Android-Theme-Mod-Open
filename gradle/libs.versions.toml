[versions]
# 26.1 upwards uses Java 25 - confirmed via the LiquidBounce 26.2 project's own libs.versions.toml
jdk = "25"

# Fabric toolchain - updated for Minecraft 26.3
# Loader 0.19.5 (stable), Fabric API 0.161.0+26.3, Loom 1.18.2 (stable)
# Refs: https://fabricmc.net/2026/09/15/263.html , matrix.oliveryasuna.com, Fabric Maven
minecraft = "26.3"
fabric-loom = "1.18.2"
fabric-loader = "0.19.5"
fabric-api = "0.161.0+26.3"

# Kotlin (fabric-language-kotlin bundles a matching Kotlin stdlib version)
# Keep 2.4.0 / 1.13.12 line for minimal change; 1.14.x available if needed
kotlin = "2.4.0"
fabric-kotlin = "1.13.12+kotlin.2.4.0"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-kotlin" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
